# .github/workflows/kestra-deploy.yml
name: Deploy Kestra Resources

on:
  push:
    branches:
      - prod
    paths:
      - 'kestra/**'
  pull_request:
    paths:
      - 'kestra/**'

jobs:
  # Validação em PRs
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate structure
        run: ./.githooks/validate-kestra-structure.sh

  # Descobrir namespaces de flows
  discover-flow-namespaces:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      namespaces: ${{ steps.find-namespaces.outputs.namespaces }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Find flow namespaces
        id: find-namespaces
        run: |
          FLOWS_DIR="kestra/flows"
          
          if [ ! -d "$FLOWS_DIR" ]; then
            echo "namespaces=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Descobrir todos os diretórios únicos que contêm flows
          namespaces=$(find "$FLOWS_DIR" -type f \( -name "*.yml" -o -name "*.yaml" \) -exec dirname {} \; | sort -u | while read -r dir; do
            relative_dir="${dir#$FLOWS_DIR/}"
            namespace=$(echo "$relative_dir" | tr '/' '.')
            echo "{\"namespace\":\"$namespace\",\"directory\":\"$dir\"}"
          done | jq -s -c .)
          
          echo "namespaces=$namespaces" >> "$GITHUB_OUTPUT"
          echo "Found namespaces: $namespaces"

  # Deploy flows por namespace
  deploy-flows:
    if: github.event_name == 'push'
    needs: discover-flow-namespaces
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        namespace-config: ${{ fromJson(needs.discover-flow-namespaces.outputs.namespaces) }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy flows for ${{ matrix.namespace-config.namespace }}
        uses: kestra-io/deploy-action@v0.22.0
        with:
          namespace: ${{ matrix.namespace-config.namespace }}
          resource: flow
          directory: ${{ matrix.namespace-config.directory }}
          server: ${{ secrets.KESTRA_HOST }}
          user: ${{ secrets.KESTRA_USER }}
          password: ${{ secrets.KESTRA_PASSWORD }}
          delete: false

  # Descobrir namespaces de files
  discover-file-namespaces:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      namespaces: ${{ steps.find-namespaces.outputs.namespaces }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Find file namespaces
        id: find-namespaces
        run: |
          FILES_DIR="kestra/files"
          
          if [ ! -d "$FILES_DIR" ]; then
            echo "namespaces=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Descobrir apenas diretórios que contêm arquivos (folhas da árvore)
          namespaces=$(find "$FILES_DIR" -type f | while read -r file; do
            dir=$(dirname "$file")
            echo "$dir"
          done | sort -u | while read -r dir; do
            relative_dir="${dir#$FILES_DIR/}"
            namespace=$(echo "$relative_dir" | tr '/' '.')
            echo "{\"namespace\":\"$namespace\",\"directory\":\"$dir\"}"
          done | jq -s -c .)
          
          echo "namespaces=$namespaces" >> "$GITHUB_OUTPUT"
          echo "Found file namespaces: $namespaces"

  # Deploy namespace files por namespace
  deploy-files:
    if: github.event_name == 'push'
    needs: [deploy-flows, discover-file-namespaces]
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        namespace-config: ${{ fromJson(needs.discover-file-namespaces.outputs.namespaces) }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy files for ${{ matrix.namespace-config.namespace }}
        uses: kestra-io/deploy-action@v0.22.0
        with:
          namespace: ${{ matrix.namespace-config.namespace }}
          resource: namespace_files
          directory: ${{ matrix.namespace-config.directory }}
          to: /
          server: ${{ secrets.KESTRA_HOST }}
          user: ${{ secrets.KESTRA_USER }}
          password: ${{ secrets.KESTRA_PASSWORD }}
          delete: false
