# .github/workflows/kestra-deploy.yml
name: Deploy Kestra Resources

on:
  push:
    branches:
      - prod
    paths:
      - 'kestra/**'
  pull_request:
    paths:
      - 'kestra/**'

jobs:
  # Validação em PRs
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate structure
        run: ./.githooks/validate-kestra-structure.sh

  # Deploy de flows
  deploy-flows:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy flows to Kestra
        env:
          KESTRA_HOST: ${{ secrets.KESTRA_HOST }}
          KESTRA_USER: ${{ secrets.KESTRA_USER }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
        run: |
          #!/bin/bash
          set -e
          
          echo "🚀 Deploying flows to Kestra..."
          
          FLOWS_DIR="kestra/flows"
          
          if [ ! -d "$FLOWS_DIR" ]; then
            echo "No flows directory found, skipping"
            exit 0
          fi
          
          # Função para descobrir namespaces únicos
          discover_namespaces() {
            find "$FLOWS_DIR" -type f \( -name "*.yml" -o -name "*.yaml" \) | while read -r file; do
              local dir=$(dirname "$file")
              local relative_dir="${dir#$FLOWS_DIR/}"
              
              # Converter caminho em namespace
              local namespace=$(echo "$relative_dir" | tr '/' '.')
              
              echo "$namespace|$dir"
            done | sort -u
          }
          
          # Deploy para cada namespace descoberto
          while IFS='|' read -r namespace dir; do
            echo ""
            echo "📦 Deploying namespace: $namespace"
            echo "   Directory: $dir"
            
            ./bin/kestra.sh flow namespace update \
              --server "$KESTRA_HOST" \
              --user "$KESTRA_USER:$KESTRA_PASSWORD" \
              "$namespace" \
              "$dir"
            
            echo "✅ Namespace $namespace deployed successfully"
          done < <(discover_namespaces)
          
          echo ""
          echo "✅ All flows deployed successfully!"

  # Deploy de files
  deploy-files:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    needs: deploy-flows
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy namespace files
        env:
          KESTRA_HOST: ${{ secrets.KESTRA_HOST }}
          KESTRA_USER: ${{ secrets.KESTRA_USER }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
        run: |
          #!/bin/bash
          set -e
          
          echo "📁 Deploying namespace files..."
          
          FILES_DIR="kestra/files"
          
          if [ ! -d "$FILES_DIR" ]; then
            echo "No files directory found, skipping"
            exit 0
          fi
          
          # Função para fazer upload de arquivos de um namespace
          upload_namespace_files() {
            local namespace_path=$1
            local namespace=$(echo "$namespace_path" | sed "s|^${FILES_DIR}/||" | tr '/' '.')
            
            echo ""
            echo "📦 Namespace: $namespace"
            
            # Encontrar todos os arquivos neste namespace
            find "$namespace_path" -type f | while read -r file; do
              # Caminho relativo ao namespace
              local rel_path="${file#$namespace_path/}"
              
              echo "  ↗ Uploading: $rel_path"
              
              # Upload usando Kestra CLI via Docker wrapper
              ./bin/kestra.sh namespace files update \
                --server "$KESTRA_HOST" \
                --user "$KESTRA_USER:$KESTRA_PASSWORD" \
                "$namespace" \
                "$rel_path" \
                "$file"
            done
          }
          
          # Iterar por todos os namespaces (diretórios de primeiro nível)
          find "$FILES_DIR" -mindepth 1 -type d | while read -r namespace_dir; do
            upload_namespace_files "$namespace_dir"
          done
          
          echo ""
          echo "✅ All files deployed successfully!"
